{% extends 'base.html' %}

{% block title %}Page Not Found (404) — EcoSync{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="rounded-circle bg-light text-muted mx-auto d-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
        <i class="fa-solid fa-triangle-exclamation fa-2x text-warning"></i>
    </div>
    <h1 class="display-5 fw-bold text-dark mb-2">404</h1>
    <h4 class="text-secondary mb-3">Page Not Found</h4>
    <p class="text-muted small mx-auto mb-4" style="max-width: 450px;">
        The page or resource you requested does not exist in the EcoSync platform.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary btn-sm px-4">
        <i class="fa-solid fa-house me-1"></i> Return to Home
    </a>
</div>
{% endblock %}
