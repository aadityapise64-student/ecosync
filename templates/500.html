{% extends 'base.html' %}

{% block title %}Server Error (500) — EcoSync{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="rounded-circle bg-danger-subtle text-danger mx-auto d-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
        <i class="fa-solid fa-server fa-2x"></i>
    </div>
    <h1 class="display-5 fw-bold text-dark mb-2">500</h1>
    <h4 class="text-secondary mb-3">Internal Server Error</h4>
    <p class="text-muted small mx-auto mb-4" style="max-width: 450px;">
        Something went wrong while processing your request. Please try again or return to the main dashboard.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary btn-sm px-4">
        <i class="fa-solid fa-house me-1"></i> Return to Home
    </a>
</div>
{% endblock %}
